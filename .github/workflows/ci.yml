# Template for the public evaluation snapshot (jihyuntesting-boop/hamkkebom2).
# The private repo's public sync copies this file to .github/workflows/ci.yml.
# It does not run in the private repo (public-ci/ is not a workflow folder).
# Everything here must work with only the synced files: web/, README.md,
# package.json, package-lock.json, lint/format configs, scripts/build_core_modules.py,
# scripts/run_public_tests.mjs, scripts/public_test_network_guard.cjs and the
# public tests listed in that runner. No secrets and no external API calls.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies (npm ci)
        if: hashFiles('package-lock.json') != ''
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint, 0 errors required)
        if: hashFiles('package-lock.json') != ''
        run: npm run lint

      - name: Format check (Prettier, tooling files only)
        if: hashFiles('package-lock.json') != ''
        run: npm run format:check

      - name: Bundle matches the six core-src parts
        run: |
          python scripts/build_core_modules.py --check
          node --check web/assets/scripts/00-app-core.js

      - name: Public unit tests (offline, network guard on)
        run: node scripts/run_public_tests.mjs
